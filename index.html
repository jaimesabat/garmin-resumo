<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resumo de treino</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f0fa;--card:#fff;--fg:#0a2a54;--mut:#4d6788;--line:#b9d2f0;--seg:#d6e4f6;--wa:#13814a;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a33;--card:#0e2444;--fg:#e6f0fc;--mut:#9db4d3;--line:#25497a;--seg:#0b1f3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071a33;--card:#0e2444;--fg:#e6f0fc;--mut:#9db4d3;--line:#25497a;--seg:#0b1f3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,#0c4a86,#0a2a54 55%,#071c3a);padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 64px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 46px,rgba(91,184,255,.17) 46px 49px)}
.in{position:relative;max-width:760px;margin:0 auto}
h1{font:800 clamp(40px,10vw,64px)/.98 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0 0 12px;letter-spacing:.005em}
.hero p{margin:0;max-width:30ch;color:#cfe3fa;font-size:18px}
main{max-width:760px;margin:0 auto;padding:0 16px 48px}
.drop{position:relative;display:grid;gap:6px;text-align:center;margin-top:-34px;padding:26px 20px;background:var(--card);border:2px dashed var(--line);border-radius:22px;cursor:pointer;box-shadow:0 16px 36px -18px rgba(10,42,84,.55)}
.drop strong{font:700 24px/1.1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}
.drop span{color:var(--mut);font-size:15px}
.drop:focus-within{outline:3px solid var(--fg);outline-offset:3px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.seg{display:flex;gap:4px;background:var(--seg);padding:4px;border-radius:14px;margin:18px 0 26px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:15px;padding:10px 6px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 5px rgba(10,42,84,.22)}
button:focus-visible,a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
section{margin:0 0 36px}
img{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 14px 34px -14px rgba(10,42,84,.5)}
.cap{margin:12px 2px 10px;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;gap:10px;flex-wrap:wrap}
.wa{flex:1 1 220px;background:var(--wa);color:#fff;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:700;cursor:pointer}
.alt{display:inline-flex;align-items:center;border:2px solid var(--line);color:var(--fg);border-radius:14px;padding:13px 18px;text-decoration:none;font-weight:600}
.note{margin:10px 2px 0;color:var(--mut);font-size:14px}
.msg{padding:16px;border:2px solid var(--line);border-radius:14px;color:var(--mut)}
.card{position:relative;margin-top:-34px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 16px 36px -18px rgba(10,42,84,.55)}
.card h2{font:700 26px/1.1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em;margin:0 0 8px}
.card p{margin:0 0 12px;color:var(--mut);font-size:15px}
.card input[type=password]{display:block;width:100%;box-sizing:border-box;font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);margin-bottom:12px}
.card .wa{display:block;width:100%}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.head h2{margin:0}
.btns{display:flex;gap:8px}
.mini{background:transparent;border:2px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--card);border-color:var(--fg)}
details{margin:16px 2px 0;color:var(--mut)}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.pick{position:relative;display:grid;gap:6px;text-align:center;margin-top:10px;padding:20px;border:2px dashed var(--line);border-radius:16px;cursor:pointer;background:var(--card)}
.pick strong{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;color:var(--fg)}
.pick:focus-within{outline:3px solid var(--fg);outline-offset:3px}
.card .mini:focus-visible,.chips button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<header class="hero"><div class="in"><h1>Resumo de treino</h1><p>Do arquivo do relógio ao cartão pronto para mandar ao treinador.</p></div></header>
<main>
<div id="conn" class="card"></div>
<details><summary>Abrir um arquivo .fit deste aparelho</summary>
<label class="pick"><input id="f" type="file" multiple><strong>Escolher arquivo .fit</strong><span>Use para ver um treino que não está no repositório.</span></label></details>
<div class="seg" id="seg" role="group" aria-label="Modo do resumo"><button data-m="auto" aria-pressed="true">Automático</button><button data-m="km" aria-pressed="false">Por km</button><button data-m="lap" aria-pressed="false">Voltas</button></div>
<div id="out"></div>
</main>
<script>
const EPOCH=631065600,F='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const KEEP={20:[253,3,5],19:[8,9,10,15,16,24],18:[2,5,8,9,16,17]},NAME={20:'record',19:'lap',18:'session'};

function parseFit(buf){
 const dv=new DataView(buf);
 if(buf.byteLength<14||String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11))!=='.FIT')throw new Error('fit');
 const hs=dv.getUint8(0),end=Math.min(hs+dv.getUint32(4,true),buf.byteLength);
 let p=hs;const defs={},out={record:[],lap:[],session:[]};
 const rd=(bt,o,le)=>{switch(bt&31){
  case 0:case 2:{const v=dv.getUint8(o);return v===255?null:v}
  case 1:{const v=dv.getInt8(o);return v===127?null:v}
  case 10:return dv.getUint8(o)||null;
  case 3:{const v=dv.getInt16(o,le);return v===32767?null:v}
  case 4:{const v=dv.getUint16(o,le);return v===65535?null:v}
  case 11:return dv.getUint16(o,le)||null;
  case 5:{const v=dv.getInt32(o,le);return v===2147483647?null:v}
  case 6:{const v=dv.getUint32(o,le);return v===4294967295?null:v}
  case 12:return dv.getUint32(o,le)||null}
  return null};
 const data=d=>{const m={},k=KEEP[d.g];let o=p;
  for(const[n,s,bt]of d.f){if(k&&k.includes(n))m[n]=rd(bt,o,d.le);o+=s}
  p=o+d.x;if(k)out[NAME[d.g]].push(m)};
 while(p<end){
  const h=dv.getUint8(p++);
  if(h&128){data(defs[(h>>5)&3]);continue}
  if(h&64){p++;const le=dv.getUint8(p++)===0,g=dv.getUint16(p,le);p+=2;
   const n=dv.getUint8(p++),f=[];
   for(let i=0;i<n;i++){f.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)]);p+=3}
   let x=0;if(h&32){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){x+=dv.getUint8(p+1);p+=3}}
   defs[h&15]={le,g,f,x}}
  else data(defs[h&15])}
 return out}

const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const hrStat=a=>a.length?{avg:mean(a),max:a.reduce((m,v)=>v>m?v:m,0)}:{avg:null,max:null};
const fp=(d,t)=>{if(!d||!t)return'–';const s=Math.round(t/(d/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const nf=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:2});
const fd=m=>m>=1000?nf(m/1000)+' km':Math.round(m)+' m';
const fh=v=>v==null?'–':String(Math.round(v));
const fp100=(d,t)=>fp(d*10,t);
const nf1=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const hms=t=>{t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(t%60).padStart(2,'0')};

function analyze(buf){
 const x=parseFit(buf),s=x.session[0]||{};
 const rec=x.record.filter(r=>r[253]!=null&&r[5]!=null).map(r=>({t:r[253],d:r[5]/100,hr:r[3]}));
 const laps=x.lap.map(l=>({d:(l[9]||0)/100,t:(l[8]||0)/1000,avg:l[15],max:l[16],int:l[24],strokes:l[10]})).filter(l=>l.t>0);
 if(!rec.length&&!laps.length)throw new Error('vazio');
 const hs=hrStat(rec.map(r=>r.hr).filter(v=>v!=null));
 const dist=s[9]!=null?s[9]/100:(rec.length?rec[rec.length-1].d-rec[0].d:laps.reduce((a,l)=>a+l.d,0));
 const time=s[8]!=null?s[8]/1000:(rec.length>1?rec[rec.length-1].t-rec[0].t:laps.reduce((a,l)=>a+l.t,0));
 return{rec,laps,dist,time,avg:s[16]!=null?s[16]:hs.avg,max:s[17]!=null?s[17]:hs.max,sport:s[5],date:s[2]!=null?new Date((s[2]+EPOCH)*1000):null}}

function splits(rec,U=1000){
 if(rec.length<2)return[];
 const b0=rec[0].d,S=[];let k=U,t0=rec[0].t,h=[];
 const push=(d,t)=>{const q=hrStat(h);S.push({d,t,avg:q.avg,max:q.max});h=[]};
 for(let i=1;i<rec.length;i++){
  const a=rec[i-1],b=rec[i],ad=a.d-b0,bd=b.d-b0;
  if(b.hr!=null)h.push(b.hr);
  while(bd>=k&&bd>ad){const tt=a.t+(b.t-a.t)*(k-ad)/(bd-ad);push(U,tt-t0);t0=tt;k+=U}}
 const L=rec[rec.length-1],rem=L.d-b0-(k-U);
 if(rem>=U/10)push(rem,L.t-t0);
 return S}

const isRest=l=>l.int===1||l.int===4;
function workLaps(L){
 const w=L.filter((l,i)=>!isRest(l)&&l.d>=180&&L[i+1]&&isRest(L[i+1]));
 if(w.length>=2)return w;
 let iv=L.filter(l=>l.int===5);
 if(!iv.length&&L.some(l=>l.int===3||l.int===4))iv=L.filter(l=>l.int===0&&l.d>=180);
 return iv}

function model(a,mode){
 const sp=a.sport===2?2:a.sport===5?5:(a.sport===1||a.sport==null)?1:0;
 const title='TREINO'+(sp?' DE '+{1:'CORRIDA',2:'CICLISMO',5:'NATAÇÃO'}[sp]:''),icon={1:'run',2:'bike',5:'swim'}[sp]||'run';
 const date=a.date?a.date.toLocaleDateString('pt-BR'):'';
 const H=[['FC MÉDIA','(bpm)','heart'],['FC MÁXIMA','(bpm)','heart']];
 if(sp===5){
  const L=a.laps.filter(l=>!isRest(l)&&l.d>0);
  if(!L.length)throw new Error('sem dados');
  const D=L.reduce((s,l)=>s+l.d,0),T=L.reduce((s,l)=>s+l.t,0);
  return{title,date,icon,sub:Math.round(a.dist||D)+' m',
   cols:[['SÉRIE','','pin'],['PACE','(min/100 m)','watch'],H[0],['BRAÇADAS','(total)','bars']],
   rows:L.map(l=>[Math.round(l.d/5)*5+' m',fp100(l.d,l.t),fh(l.avg),l.strokes!=null?String(l.strokes):'–']),
   foot:[['PACE MÉDIO',fp100(D,T)+' /100 m','bars'],['TEMPO',hms(a.time||T),'watch'],['FC MÉDIA',fh(a.avg)+' bpm','heart']]}}
 const iv=sp===1?workLaps(a.laps):[];
 if(mode==='auto'&&iv.length>=2){
  const r=iv.map(l=>Math.round(l.d/50)*50),sub=r.every(v=>v===r[0])?iv.length+' x '+fd(r[0]):iv.length+' tiros';
  const D=iv.reduce((s,l)=>s+l.d,0),T=iv.reduce((s,l)=>s+l.t,0);
  return{title,date,icon,sub,col:'TIRO',rows:iv.map(l=>[fd(Math.round(l.d/10)*10),fp(l.d,l.t),fh(l.avg),fh(l.max)]),
   foot:[['TIROS',sub,'shoe'],['PACE MÉDIO',fp(D,T)+' /km','bars'],['FC MÉDIA GERAL',fh(a.avg)+' bpm','heart']]}}
 const bike=sp===2,U=bike?5000:1000,base=a.laps.filter(l=>l.d>0);
 let km=mode!=='lap',S=km?splits(a.rec,U):base;
 if(!S.length){S=base;km=false}
 if(!S.length)throw new Error('sem dados');
 return{title,date,icon,sub:fd(a.dist),col:km?'KM':'VOLTA',
  cols:bike?[[km?'KM':'VOLTA','','pin'],['VELOC.','(km/h)','watch'],...H]:null,
  rows:S.map((x,i)=>[km&&x.d===U?(i+1)*U/1000+' km':fd(Math.round(x.d/10)*10),bike?nf1(x.d/x.t*3.6):fp(x.d,x.t),fh(x.avg),fh(x.max)]),
  foot:[bike?['VELOC. MÉDIA',nf1(a.dist/a.time*3.6)+' km/h','bars']:['PACE MÉDIO',fp(a.dist,a.time)+' /km','bars'],['FC MÉDIA',fh(a.avg)+' bpm','heart'],['FC MÁXIMA',fh(a.max)+' bpm','heart']]}}

function icon(x,k,cx,cy,s,col,bg){
 x.save();x.translate(cx,cy);x.scale(s/100,s/100);
 x.strokeStyle=col;x.fillStyle=col;x.lineWidth=9;x.lineCap='round';x.lineJoin='round';
 const L=(...p)=>{x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.stroke()};
 if(k==='pin'){
  x.beginPath();x.moveTo(0,46);x.bezierCurveTo(-10,30,-34,10,-34,-10);x.arc(0,-10,34,Math.PI,0);x.bezierCurveTo(34,10,10,30,0,46);x.fill();
  x.fillStyle=bg;x.beginPath();x.arc(0,-10,13,0,7);x.fill()}
 else if(k==='watch'){
  x.beginPath();x.arc(0,8,32,0,7);x.stroke();L(-10,-36,10,-36);L(0,-36,0,-26);L(0,8,0,-12);L(0,8,13,15);L(26,-18,34,-26)}
 else if(k==='heart'){
  x.beginPath();x.moveTo(0,42);x.bezierCurveTo(-62,-6,-44,-48,-19,-44);x.bezierCurveTo(-9,-42,-3,-35,0,-28);x.bezierCurveTo(3,-35,9,-42,19,-44);x.bezierCurveTo(44,-48,62,-6,0,42);x.fill();
  x.strokeStyle=bg;x.lineWidth=7;L(-32,4,-15,4,-7,-14,6,20,14,4,32,4)}
 else if(k==='bars'){x.fillRect(-40,12,22,32);x.fillRect(-11,-8,22,52);x.fillRect(18,-34,22,78)}
 else if(k==='shoe'){
  x.beginPath();x.moveTo(-46,34);x.lineTo(42,34);x.quadraticCurveTo(54,34,50,20);x.quadraticCurveTo(44,8,24,4);x.lineTo(8,-14);x.quadraticCurveTo(0,-22,-8,-14);x.lineTo(-14,-6);x.lineTo(-30,-8);x.quadraticCurveTo(-46,-10,-46,4);x.closePath();x.fill();
  x.strokeStyle=bg;x.lineWidth=5;L(-46,23,50,23);L(-2,-6,8,2);L(8,-12,18,-2)}
 else if(k==='bike'){
  x.lineWidth=8;x.beginPath();x.arc(-30,18,20,0,7);x.stroke();x.beginPath();x.arc(30,18,20,0,7);x.stroke();
  L(-30,18,-8,-10,18,-10,30,18);L(-8,-10,-12,-22);L(-18,-22,-4,-22);L(18,-10,14,-24,28,-24)}
 else if(k==='swim'){
  x.beginPath();x.arc(26,-16,10,0,7);x.fill();L(16,-6,-8,-18,-30,-8);L(16,-4,-18,8,-42,6);
  x.lineWidth=7;L(-44,32,-30,25,-16,32,-2,25,12,32,26,25,42,32)}
 else if(k==='run'){
  x.lineWidth=12;x.beginPath();x.arc(20,-36,12,0,7);x.fill();
  L(10,-20,-6,10);L(8,-16,26,-2,38,-14);L(8,-16,-12,-8,-22,-22);L(-6,10,14,22,12,46);L(-6,10,-24,26,-46,22)}
 x.restore()}

function draw(m){
 const W=1200,hH=190,thH=146,rH=84,fH=150,g=22,top=14,tx=14,tw=W-28;
 const H=top+hH+g+thH+m.rows.length*rH+g+fH+top;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const NAVY='#0a2a54',SKY='#5bb8ff';
 const rr=(a,b,w,h,r)=>{x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h)};
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 const gr=x.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#0c4a86');gr.addColorStop(.35,NAVY);gr.addColorStop(1,NAVY);
 rr(tx,top,tw,hH,30);x.fillStyle=gr;x.fill();
 x.textAlign='center';x.fillStyle='#fff';x.font='800 66px '+F;x.fillText(m.title,W/2,top+86);
 x.fillStyle=SKY;x.font='italic 800 70px '+F;x.fillText(m.sub,W/2,top+164);icon(x,m.icon||'run',108,top+95,120,'#fff',NAVY);
 if(m.date){x.textAlign='right';x.font='500 24px '+F;x.fillStyle='#9fc4ee';x.fillText(m.date,W-48,top+46)}
 const ty=top+hH+g,bh=m.rows.length*rH,cw=[.22,.23,.275,.275].map(v=>v*tw);
 x.save();rr(tx,ty,tw,thH+bh,26);x.clip();
 x.fillStyle=NAVY;x.fillRect(tx,ty,tw,thH);
 m.rows.forEach((r,i)=>{x.fillStyle=i%2?'#e6f0fc':'#f8fbff';x.fillRect(tx,ty+thH+i*rH,tw,rH)});
 const heads=m.cols||[[m.col,'','pin'],['PACE','(min/km)','watch'],['FC MÉDIA','(bpm)','heart'],['FC MÁXIMA','(bpm)','heart']];
 let cx=tx;
 heads.forEach((h,j)=>{const mid=cx+cw[j]/2;x.textAlign='center';
  icon(x,h[2],mid,ty+38,50,'#fff',NAVY);x.fillStyle='#fff';x.font='800 32px '+F;x.fillText(h[0],mid,ty+(h[1]?94:112));
  if(h[1]){x.font='500 24px '+F;x.fillStyle='#cfe3fa';x.fillText(h[1],mid,ty+126)}
  x.fillStyle=NAVY;x.font='800 46px '+F;
  m.rows.forEach((r,i)=>x.fillText(r[j],mid,ty+thH+i*rH+57));
  if(j){x.fillStyle='#2a4f84';x.fillRect(cx-1,ty,2,thH);x.fillStyle='#bcd6f3';x.fillRect(cx-1,ty+thH,2,bh)}
  cx+=cw[j]});
 x.restore();
 rr(tx,ty,tw,thH+bh,26);x.strokeStyle='#bcd6f3';x.lineWidth=3;x.stroke();
 const fy=ty+thH+bh+g,n=m.foot.length,w=tw/n;
 rr(tx,fy,tw,fH,30);x.fillStyle='#bfdffb';x.fill();
 m.foot.forEach((f,j)=>{const L=tx+w*j,tl=L+124;x.textAlign='left';icon(x,f[2],L+66,fy+fH/2,66,NAVY,'#bfdffb');
  x.fillStyle=NAVY;x.font='700 23px '+F;x.fillText(f[0],tl,fy+56);
  let fs=54;x.font='800 '+fs+'px '+F;while(x.measureText(f[1]).width>w-140&&fs>28){fs-=2;x.font='800 '+fs+'px '+F}x.fillText(f[1],tl,fy+114);
  if(j){x.fillStyle='rgba(10,42,84,.35)';x.fillRect(tx+w*j-1,fy+28,2,fH-56)}});
 return c}

const cap=t=>(t.charAt(0)+t.slice(1).toLowerCase()).replace(/^Fc/,'FC');
function summary(m){
 return cap(m.title)+' – '+m.sub+(m.date?' ('+m.date+')':'')+'\n'+
  m.rows.map((r,i)=>(i+1)+') '+r[0]+' | pace '+r[1]+' | FC '+r[2]+'/'+r[3]).join('\n')+'\n'+
  m.foot.map(f=>cap(f[0])+': '+f[1]).join('\n')}

async function sendWa(c,name,note){
 note.textContent='';
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const f=new File([blob],name.replace(/\.fit$/i,'')+'.png',{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
 catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
  note.textContent='Imagem copiada. Abra o WhatsApp, toque no campo de mensagem e cole.';return}catch(e){}
 note.textContent='Não consegui abrir o compartilhamento aqui. Toque e segure na imagem para salvar ou copiar.'}

const REPO={owner:'jaimesabat',name:'Garmin-treinos',dir:'fit'};
const API='https://api.github.com/repos/'+REPO.owner+'/'+REPO.name+'/contents/'+REPO.dir;
const out=document.getElementById('out'),seg=document.getElementById('seg'),conn=document.getElementById('conn');
let mode='auto',cur=null,list=[],shown=[],busy=false;const cache={};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const tok={get(){try{return localStorage.getItem('gh_token')||''}catch(e){return''}},
 set(v){try{if(v)localStorage.setItem('gh_token',v);else localStorage.removeItem('gh_token')}catch(e){}}};

async function gh(url,raw){
 const r=await fetch(url,{headers:{Authorization:'Bearer '+tok.get(),Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'}});
 if(r.status===401||r.status===403)throw new Error('auth');
 if(r.status===404)throw new Error('404');
 if(!r.ok)throw new Error('http');
 return raw?r.arrayBuffer():r.json()}
const errText=e=>e.message==='auth'?'O GitHub recusou o token. Confira se ele não expirou e se tem permissão de leitura (Contents: Read-only) no repositório. Se precisar, toque em Desconectar e cole um novo.'
 :e.message==='404'?'Não achei a pasta fit no repositório. Rode o workflow no GitHub (Actions) ou confira se o token tem acesso ao repositório.'
 :'Não consegui falar com o GitHub. Verifique a conexão e tente de novo.';

function lab(n){
 const m=n.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return n;
 let t=new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','');
 const ty=(n.match(/^\d{4}-\d{2}-\d{2}_(.+)_\d+\.fit$/i)||[])[1]||'';t=(/swim/.test(ty)?'🏊 ':/cycl|bik/.test(ty)?'🚴 ':/run/.test(ty)?'🏃 ':'')+t;
 const same=list.filter(x=>x.slice(0,10)===n.slice(0,10));
 if(same.length>1)t+=' #'+(same.length-same.indexOf(n));
 return t}
function markChips(){conn.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.n===cur))}

function drawConn(){
 conn.replaceChildren();
 if(!tok.get()){
  conn.append(el('h2',null,'Conectar ao repositório'),el('p',null,'Cole um token do GitHub com acesso somente de leitura ao repositório '+REPO.name+'. Ele fica salvo apenas neste navegador.'));
  const inp=el('input');inp.type='password';inp.placeholder='github_pat_…';inp.autocomplete='off';inp.setAttribute('aria-label','Token do GitHub');
  const b=el('button','wa','Conectar');b.onclick=()=>{const v=inp.value.trim();if(v){tok.set(v);loadList()}};
  conn.append(inp,b);return}
 const h=el('div','head'),bt=el('div','btns');
 const r=el('button','mini','Atualizar');r.onclick=loadList;
 const d=el('button','mini','Desconectar');d.onclick=()=>{tok.set('');list=[];cur=null;shown=[];out.replaceChildren();drawConn()};
 bt.append(r,d);h.append(el('h2',null,'Treinos disponíveis'),bt);conn.append(h);
 const c=el('div','chips');
 for(const n of list){const b=el('button',null,lab(n));b.dataset.n=n;b.setAttribute('aria-pressed',n===cur);b.onclick=()=>pick(n);c.append(b)}
 conn.append(c)}

async function loadList(){
 busy=true;drawConn();out.replaceChildren(el('div','msg','Buscando treinos no GitHub…'));
 try{
  const files=await gh(API);
  list=files.filter(f=>/\.fit$/i.test(f.name)).map(f=>f.name).sort().reverse();
  busy=false;drawConn();
  if(!list.length){out.replaceChildren(el('div','msg','Ainda não há arquivos na pasta fit. Rode o workflow no GitHub (Actions) e toque em Atualizar.'));return}
  pick(list[0])
 }catch(e){busy=false;drawConn();out.replaceChildren(el('div','msg',errText(e)))}}

async function pick(n){
 cur=n;markChips();
 if(cache[n]){shown=[{name:n,a:cache[n]}];render();return}
 out.replaceChildren(el('div','msg','Carregando o treino…'));
 try{
  const a=analyze(await gh(API+'/'+encodeURIComponent(n),true));
  cache[n]=a;if(cur!==n)return;shown=[{name:n,a}];render()
 }catch(e){if(cur!==n)return;
  out.replaceChildren(el('div','msg',['auth','404','http'].includes(e.message)||e instanceof TypeError?errText(e):'Não consegui ler este arquivo. Ele parece estar incompleto ou corrompido.'))}}

function render(){
 out.replaceChildren();
 for(const it of shown){
  const s=el('section');out.append(s);
  try{
   if(it.err)throw 0;
   const m=model(it.a,mode),c=draw(m),img=new Image();
   img.src=c.toDataURL('image/png');img.alt='Resumo do treino '+it.name;
   const note=el('p','note'),act=el('div','act'),b=el('button','wa','Enviar no WhatsApp');
   b.onclick=()=>sendWa(c,it.name,note);
   const a=el('a','alt','Só o texto');a.href='https://wa.me/?text='+encodeURIComponent(summary(m));a.target='_blank';a.rel='noopener';
   act.append(b,a);s.append(img,el('p','cap',it.name),act,note)
  }catch(e){s.append(el('div','msg','Não consegui ler '+it.name+'. Confira se é o arquivo .fit original de uma atividade (não o .zip).'))}}}

document.getElementById('f').onchange=async e=>{
 const fs=[...e.target.files];if(!fs.length)return;
 cur=null;markChips();shown=[];
 for(const f of fs){try{shown.push({name:f.name,a:analyze(await f.arrayBuffer())})}catch(_){shown.push({name:f.name,err:1})}}
 e.target.value='';render()};
seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...seg.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
if(tok.get())loadList();else drawConn();
</script>
</body>
</html>
